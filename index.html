<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERSONNAL FINANCIAL MANAGER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="welcome">
        <h1>PERSONNAL FINANCIAL MANAGER</h1>
        <p>Welcome to this web app that allows you to manage your personnal budgets</p>
        <p>Plan your expenses and track your savings goals</p>
        <button class="Enterbtn" id="enterBtn">ENTER</button>
    </div>
    <div class="content">
        <div class="btn-view">
            <button class="btn" data-page="dashboard">Dashboard</button>
            <button class="btn" data-page="budget">Budget</button>
            <button class="btn" data-page="upcoming">Upcoming</button>
            <button class="btn" data-page="goals">Goals</button>
            <button class="btn" data-page="history">History</button>
            <button class="btn" data-page="settings">Settings</button>
        </div>
    </div>
</body>
</html>
